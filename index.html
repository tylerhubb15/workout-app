<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WorkoutLog" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
  <title>Workout Tracker</title>
</head>
<body>
<div id="app">

  <!-- ── Home View ─────────────────────────────────── -->
  <section class="view active" id="view-home">
    <div class="home-hero">
      <div class="home-date" id="home-date"></div>
      <div class="home-greeting">Let's train 💪</div>
      <button class="btn btn-primary btn-full home-start-btn" id="btn-start-workout">
        + Start Workout
      </button>
    </div>

    <div class="section-title">Recent Workouts</div>
    <div class="workout-list" id="home-workout-list">
      <!-- populated by app.js -->
    </div>
  </section>

  <!-- ── Active Workout View ───────────────────────── -->
  <section class="view" id="view-workout">
    <div class="page-header">
      <button class="btn-back" id="btn-workout-back" title="Back">‹</button>
      <div>
        <h1>Workout</h1>
      </div>
    </div>

    <div class="workout-meta">
      <div>
        <div class="field-label">Workout Name</div>
        <input type="text" id="workout-name" placeholder="e.g. Push Day" />
      </div>
      <div>
        <div class="field-label">Date</div>
        <input type="date" id="workout-date" />
      </div>
    </div>

    <div class="section-title">Exercises</div>
    <div class="exercises-section" id="active-exercises">
      <!-- populated by app.js -->
    </div>

    <div class="workout-actions">
      <button class="btn btn-secondary btn-full" id="btn-add-exercise">+ Add Exercise</button>
      <button class="btn btn-success btn-full" id="btn-finish-workout">Finish Workout</button>
    </div>
  </section>

  <!-- ── Exercise Form View ────────────────────────── -->
  <section class="view" id="view-exercise">
    <div class="page-header">
      <button class="btn-back" id="btn-exercise-back" title="Back">‹</button>
      <div>
        <h1 id="exercise-view-title">Add Exercise</h1>
      </div>
    </div>

    <div class="exercise-form">
      <div>
        <div class="field-label">Exercise Name</div>
        <input type="text" id="exercise-name" placeholder="e.g. Bench Press" autocomplete="off" />
      </div>

      <div class="sets-form-section">
        <div class="field-label">Sets</div>
        <table class="sets-form-table">
          <thead>
            <tr>
              <th style="width:36px">Set</th>
              <th>Reps</th>
              <th>Weight (lbs)</th>
              <th style="width:36px"></th>
            </tr>
          </thead>
          <tbody id="sets-form-body">
            <!-- rows added by app.js -->
          </tbody>
        </table>
        <button class="btn btn-secondary btn-sm" id="btn-add-set">+ Add Set</button>
      </div>

      <button class="btn btn-primary btn-full" id="btn-save-exercise">Save Exercise</button>
    </div>
  </section>

  <!-- ── History View ──────────────────────────────── -->
  <section class="view" id="view-history">
    <div class="page-header">
      <h1>History</h1>
    </div>
    <div class="history-list" id="history-list">
      <!-- populated by app.js -->
    </div>
  </section>

  <!-- ── Bottom Navigation ─────────────────────────── -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-view="home">
      <span class="nav-icon">🏠</span>
      Home
    </button>
    <button class="nav-btn" data-view="history">
      <span class="nav-icon">📋</span>
      History
    </button>
  </nav>

</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
